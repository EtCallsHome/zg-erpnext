name: Build ERPNext v15 + E-Invoice

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read
  packages: write

concurrency:
  group: zg-erpnext-v15
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ERPNext image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ghcr.io/etcallshome/zg-erpnext:v15
            ghcr.io/etcallshome/zg-erpnext:build-${{ github.run_number }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=./apps.json
          labels: |
            org.opencontainers.image.source=https://github.com/EtCallsHome/zg-erpnext
